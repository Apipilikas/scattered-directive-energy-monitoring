# PV for etcd-0
apiVersion: v1
kind: PersistentVolume
metadata:
  name: core-etcd-pv-0
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/core-etcd-data-0"
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: {{ .Values.Namespace }}
    name: etcd-data-etcd-0
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - {{ .Values.node }}
---
